<!-- Section cas client, mise de côté le temps d'obtenir un verbatim autorisé
     et des chiffres réels (voir 03-preuves.md). À réinsérer dans index.html
     entre la section #duo et la section #pour-qui. Les styles .cas sont
     toujours présents dans le <style> de index.html.
     Rappel 03-preuves.md : pas de faux verbatim, pas de chiffre invérifiable.
     En attendant l'accord du client, version anonymisée possible :
     « un acteur de la gestion locative, 80 salariés ». -->

  <section id="cas" class="cas">
    <div class="container cas-inner">
      <div class="cas-quote-block" data-reveal>
        <div class="kicker">Cas client</div>
        <p class="cas-quote">«&nbsp;Verbatim client à insérer&nbsp;: ce qui coinçait avant, ce qui a changé après, dit avec leurs mots.&nbsp;»</p>
        <div class="cas-author">
          <span class="dot"></span>
          <span>Prénom Nom, fonction, entreprise</span>
        </div>
      </div>
      <div class="cas-stats">
        <div class="cas-stat" data-reveal style="--d:.1s">
          <span class="cas-stat-label">Temps de saisie par semaine</span>
          <span class="cas-stat-value">— %</span>
        </div>
        <div class="cas-stat" data-reveal style="--d:.2s">
          <span class="cas-stat-label">Fiches en doublon</span>
          <span class="cas-stat-value">— %</span>
        </div>
        <div class="cas-stat" data-reveal style="--d:.3s">
          <span class="cas-stat-label">Délai de reporting mensuel</span>
          <span class="cas-stat-value">— j</span>
        </div>
        <div class="cas-note" data-reveal style="--d:.4s">Chiffres à remplir avec des mesures réelles</div>
      </div>
    </div>
  </section>
